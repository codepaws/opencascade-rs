# Daedalus-internal fork of opencascade-rs v0.2.0 with build fixes for
# Windows + CMake 4 + VS 2026. Not for upstream PR (consumed via
# [patch.crates-io] from D:\projects\daedalus).
[workspace]
members = ["crates/opencascade-sys", "crates/occt-sys"]
resolver = "2"

[profile.release.package.occt-sys]
opt-level = 3
